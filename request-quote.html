<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote | Prime Industrial Technology Limited</title>
  <meta name="description" content="Request a quote for industrial machine supply, hiring, leasing, installation or maintenance from Prime Industrial Technology Limited.">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>

<div data-include="/partials/header.html"></div>

<main>
  <section class="page-banner">
    <div class="container">
      <h1>Request a Quote</h1>
      <p>Tell us what you need and we'll help you find the right equipment solution.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <form class="form" data-inquiry>
        <div class="row">
          <div><label for="name">Name</label><input id="name" name="name" type="text" required></div>
          <div><label for="company">Company</label><input id="company" name="company" type="text"></div>
        </div>
        <div class="row">
          <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required></div>
          <div><label for="email">Email</label><input id="email" name="email" type="email"></div>
        </div>
        <div>
          <label for="need">What do you need?</label>
          <select id="need" name="need" required>
            <option value="">Select one</option>
            <option>Machine Hiring</option>
            <option>Equipment Leasing</option>
            <option>Machine Supply</option>
            <option>Installation</option>
            <option>Servicing & Maintenance</option>
            <option>Technical Support</option>
            <option>Not sure yet</option>
          </select>
        </div>
        <div>
          <label for="message">Equipment details</label>
          <textarea id="message" name="message" rows="6"
            placeholder="Type of machine, capacity, quantity, location, duration (for hire/lease)..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Quote Request</button>
      </form>
    </div>
  </section>
</main>

<div data-include="/partials/footer.html"></div>

<script src="/assets/js/nav.js"></script>
<script src="/assets/js/form.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
