<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Prime Industrial Technology Limited</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
<section class="page-banner"><div class="container"><h1>Admin Panel</h1></div></section>

<section>
  <div class="container admin-box">

    <form id="login-form" class="form">
      <h2>Sign in</h2>
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="btn btn-primary" type="submit">Sign In</button>
      <p class="status" id="login-status"></p>
    </form>

    <div id="panel" class="hidden">
      <div class="admin-top">
        <h2>Add Product</h2>
        <button id="logout" class="btn btn-outline" type="button">Sign Out</button>
      </div>

      <form id="product-form" class="form" style="max-width:none;">
        <input id="p-name" type="text" placeholder="Product name" required>
        <select id="p-cat" required>
          <option value="">Select category</option>
          <option value="packaging">Packaging Machines</option>
          <option value="filling">Filling Machines</option>
          <option value="production">Production Machines</option>
          <option value="processing">Processing Equipment</option>
          <option value="cooling">Industrial Cooling Equipment</option>
          <option value="other">Other Machinery</option>
        </select>
        <textarea id="p-desc" rows="4" placeholder="Description" required></textarea>
        <label for="p-img">Product image</label>
        <input id="p-img" type="file" accept="image/*" required>
        <button class="btn btn-primary" type="submit" id="save-btn">Save Product</button>
        <p class="status" id="save-status"></p>
      </form>

      <div class="admin-list">
        <h2>Existing Products</h2>
        <div id="admin-list">Loading...</div>
      </div>
    </div>
  </div>
</section>

<script type="module">
import { auth, db, CLOUDINARY } from "/assets/js/firebase-config.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

onAuthStateChanged(auth, user => {
  $("login-form").classList.toggle("hidden", !!user);
  $("panel").classList.toggle("hidden", !user);
  if (user) loadList();
});

$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("login-status").textContent = "Signing in...";
  try {
    await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
    $("login-status").textContent = "";
  } catch (err) {
    $("login-status").textContent = "Sign in failed. Check your email and password.";
  }
});

$("logout").addEventListener("click", () => signOut(auth));

async function uploadImage(file) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY.uploadPreset);
  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`,
    { method: "POST", body: fd });
  if (!res.ok) throw new Error("Image upload failed");
  return (await res.json()).secure_url;
}

$("product-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("save-btn");
  btn.disabled = true;
  $("save-status").textContent = "Uploading image...";
  try {
    const imageUrl = await uploadImage($("p-img").files[0]);
    $("save-status").textContent = "Saving product...";
    await addDoc(collection(db, "products"), {
      name: $("p-name").value.trim(),
      category: $("p-cat").value,
      description: $("p-desc").value.trim(),
      imageUrl,
      createdAt: serverTimestamp()
    });
    $("product-form").reset();
    $("save-status").textContent = "Product saved.";
    loadList();
  } catch (err) {
    console.error(err);
    $("save-status").textContent = "Something went wrong: " + err.message;
  }
  btn.disabled = false;
});

async function loadList() {
  const list = $("admin-list");
  try {
    const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
    if (snap.empty) { list.textContent = "No products yet."; return; }
    list.innerHTML = snap.docs.map(d => {
      const p = d.data();
      return `<div class="admin-row">
        <img src="${esc(p.imageUrl)}" alt="">
        <div><strong>${esc(p.name)}</strong><br><small>${esc(p.category)}</small></div>
        <button class="btn btn-danger" data-id="${d.id}">Delete</button>
      </div>`;
    }).join("");
  } catch (err) {
    list.textContent = "Could not load products.";
  }
}

$("admin-list").addEventListener("click", async e => {
  const id = e.target.dataset.id;
  if (!id || !confirm("Delete this product?")) return;
  await deleteDoc(doc(db, "products", id));
  loadList();
});
</script>
</body>
</html>
